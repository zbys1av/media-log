async function cloudGet(){
 if(cloudEnabled()){
  const resp=await cloudApiRequest('/data');if(!resp.ok){let detail='';try{const issue=await resp.json();detail=String(issue?.error||'').slice(0,220);}catch(e){}throw Error('GitHub API: '+resp.status+(detail?' — '+detail:''));}
  const body=await resp.json();if(!body?.data||!Array.isArray(body.data.records))throw Error('Невірний формат JSON у GitHub');
  return {data:body.data,sha:body.sha||null};
 }
 if(location.protocol==='file:')throw Error('Для завантаження з GitHub відкрий сайт через HTTPS');
 const resp=await fetch(cloudPublicUrl()+(cloudPublicUrl().includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});
 if(!resp.ok)throw Error('data.json: '+resp.status);
 const body=await resp.json();if(!Array.isArray(body.records))throw Error('Невірний формат data.json');
 return {data:body,sha:null};
}

  const wasClean=cloudLastSynced===current;

  if(incoming===current){cloudConflict=false;cloudSaveLocalMirror();cloudInfo='Локальна й хмарна версії збігаються';}
  else if((!HAD_LOCAL_DATA||wasClean||defaultData)&&current===atStart){db=normalized;persist();applyAppearance();cloudConflict=false;cloudSaveLocalMirror();cloudInfo='Завантажено актуальну колекцію з GitHub';render();if(!startup)toast(cloudInfo);}
  else {cloudConflict=true;cloudInfo='Знайдено різні локальні та хмарні дані';if(!startup)toast('Знайдено локальні зміни. Обери версію в налаштуваннях.');}

 }
 return out;
}

function normalizeTitle(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/\s*\((?:19|20)\d{2}\)\s*/g,' ').replace(/&/g,' and ').replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ');}

async function posterLookup(r){const q=String(r.title||'').trim(),cat=r.category,releaseYear=Number(r.releaseYear)||null,season=Number(r.posterSeason)||null;if(!q)return null;
 const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),12000);
 try{
  if(cat==='tv'){
   const resp=await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`,{signal:abort.signal});if(resp.ok){const shows=await resp.json();const match=shows.find(x=>goodName(x.show?.name,q)&&yearMatches(x.show?.premiered,releaseYear));
    if(match){let picture=match.show?.image?.original||match.show?.image?.medium;
     if(season&&match.show?.id){try{const res=await fetch(`https://api.tvmaze.com/shows/${match.show.id}/seasons`,{signal:abort.signal});if(res.ok){const seasons=await res.json(),wanted=seasons.find(x=>Number(x.number)===season);if(wanted?.image?.original||wanted?.image?.medium)picture=wanted.image.original||wanted.image.medium;else return null;}}catch(e){return null;}}
     if(String(picture||'').startsWith('https://'))return {url:picture,provider:'TVmaze',source:match.show.url||'https://www.tvmaze.com/',matchedTitle:match.show.name,matchedYear:match.show.premiered?.slice(0,4)||null};}
   }
  }
  if(['movie','book','tv'].includes(cat)&&!(cat==='tv'&&season)){
   const media=cat==='book'?'ebook':cat==='movie'?'movie':'tvShow';const resp=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent([q,releaseYear].filter(Boolean).join(' '))}&country=us&media=${media}&limit=40`,{signal:abort.signal});
   if(resp.ok){const data=await resp.json();const match=(data.results||[]).find(x=>goodName(x.trackName||x.collectionName||x.artistName,q)&&yearMatches(x.releaseDate,releaseYear)&&x.artworkUrl100);
    if(match){const image=String(match.artworkUrl100).replace(/^http:/,'https:').replace('100x100bb','600x900bb');return {url:image,provider:'Apple',source:match.trackViewUrl||match.collectionViewUrl||'https://itunes.apple.com/',matchedTitle:match.trackName||match.collectionName,matchedYear:match.releaseDate?.slice(0,4)||null};}
   }
  }
  if(cat==='game'){
   const titles=releaseYear?[q+' ('+releaseYear+' video game)']:[q+' (video game)'];
   for(const t of titles){const resp=await fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=700&titles=${encodeURIComponent(t)}`,{signal:abort.signal});if(!resp.ok)continue;
    const data=await resp.json(),page=Object.values(data.query?.pages||{}).find(x=>!x.missing&&x.thumbnail?.source&&goodName(String(x.title||'').replace(/ \((?:\d{4} )?video game\)$/i,''),q));
    if(page&&String(page.thumbnail.source).startsWith('https://'))return {url:page.thumbnail.source,provider:'Wikipedia',source:'https://en.wikipedia.org/wiki/'+encodeURIComponent(page.title.replace(/ /g,'_')),matchedTitle:page.title,matchedYear:releaseYear};
   }
  }
 }catch(e){}finally{clearTimeout(timer);}return null;
}
async function wikiPosterLookup(r){const q=String(r.title||'').trim(),cat=r.category,season=Number(r.posterSeason)||null,yr=Number(r.releaseYear)||null;if(!q)return null;
 const suffix=cat==='movie'?'film':cat==='tv'?'TV series':cat==='game'?'video game':'novel';
 const titles=season&&cat==='tv'?[`${q} season ${season}`,`${q} (season ${season})`]:[`${q} (${suffix})`,q,...(yr?[`${q} (${yr} ${suffix})`]:[])];
 const url='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=850&titles='+encodeURIComponent(titles.join('|'));
 try{const controller=new AbortController(),tm=setTimeout(()=>controller.abort(),7500);let res;try{res=await fetch(url,{signal:controller.signal});}finally{clearTimeout(tm);}if(!res.ok)return null;
 const pages=Object.values((await res.json()).query?.pages||{});
 for(const page of pages){const text=String(page.title||''),clean=normalizeTitle(text.replace(/\s*\([^)]*\)$/,'')),want=normalizeTitle(q);
  const matches=clean===want||clean.startsWith(want+' season ')||clean===normalizeTitle(q+' season '+season);
  const appropriate=!season||new RegExp(`(?:season[ -]?${season}|\\(season ${season}\\))`,'i').test(text);
  if(!matches||!appropriate||!page.thumbnail?.source?.startsWith('https://'))continue;
  if(yr&&/\b(?:19|20)\d{2}\b/.test(text)&&!text.includes(String(yr)))continue;
  return {url:page.thumbnail.source,provider:'Wikipedia',source:'https://en.wikipedia.org/wiki/'+encodeURIComponent(text.replace(/ /g,'_')),matchedTitle:text,matchedYear:yr||null};
 }
 }catch(e){}return null;
}

 const W=560,H=150,L=24,R=18,T=16,B=20,coords=rated.map((v,i)=>[L+i*(W-L-R)/Math.max(1,rated.length-1),T+(100-scored100(v))*(H-T-B)/100]);
 const line=coords.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
 const points=coords.map(([x,y],i)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i===coords.length-1?5.5:4}" class="evo-point"><title>${rated[i].date?dateStr(rated[i].date):'Без дати'} · ${num(scored100(rated[i]))}/100</title></circle>`).join('');
 return `<div class="evolution-summary"><div><small>Перший бал</small><strong>${num(scored100(first))}<sub>/100</sub></strong><span>${first.date?dateStr(first.date):'Без дати'}</span></div><div class="evolution-arrow">${icon('arrow-right',19)}</div><div><small>Останній бал</small><strong>${num(scored100(last))}<sub>/100</sub></strong><span>${last.date?dateStr(last.date):'Без дати'}</span></div><div class="evolution-change ${direction}"><small>Зміна враження</small><strong>${delta}</strong><span>Порівняння в шкалі /100</span></div></div><div class="evolution-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Зміна оцінок від ${num(scored100(first))} до ${num(scored100(last))} зі ста"><line class="evo-gridline" x1="${L}" x2="${W-R}" y1="${T}" y2="${T}"/><line class="evo-gridline" x1="${L}" x2="${W-R}" y1="${T+(H-T-B)/2}" y2="${T+(H-T-B)/2}"/><line class="evo-gridline" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/><polyline class="evo-line" points="${line}"/>${points}</svg><div class="evolution-caption"><span>${first.date?dateStr(first.date):'Перший запис'}</span><span>${rated.length} ${plural(rated.length,'оцінка','оцінки','оцінок')}</span><span>${last.date?dateStr(last.date):'Останній запис'}</span></div></div>`;
}

function calcRubric(cat,scores){return Math.round(weights(cat).reduce((sum,[k,w])=>sum+(Math.min(100,Math.max(0,Number(scores[k]??70)))*w),0));}
function rubricForm(id,seasonIndex,viewId){const r=rec(id);if(!r)return;const season=seasonIndex!=null?(r.seasons?.[seasonIndex]||{name:seasonLabel(r,seasonIndex),rating:null}):null;
 const view=r.category==='movie'?(viewId?r.watchHistory?.find(x=>x.id===viewId):orderedViews(r).at(-1)):null;
 const saved=season?.rubric||view?.rubric||(!season&&!view?r.rubric:null);
 const fallback=season?.rating??view?.rating??r.rating??75;
 modal('ТРИ КРИТЕРІЇ / 100',season?`${r.title} · ${season.name}`:r.title,`<form id="rubricForm" data-id="${attr(id)}" data-season="${seasonIndex??''}" data-view="${attr(view?.id||'')}"><div class="rubric-intro"><span class="rubric-result" id="rubricResult">${num(fallback)}</span><div><strong>Підсумок /100</strong><p>${view?'Зміниться оцінка тільки обраного перегляду.':'Оціни три аспекти — додаток сам порахує зважений результат.'}</p></div></div>${weights(r.category).map(([k,w,desc],i)=>`<div class="rubric-criterion"><div class="rubric-head"><div><strong>${escapeHtml(k)}</strong><span>${escapeHtml(desc)}</span></div><span class="rubric-weight">${Math.round(w*100)}%</span></div><div class="rubric-slider"><span>0</span><input type="range" min="0" max="100" step="1" name="criterion${i}" data-criterion="${attr(k)}" value="${saved?.scores?.[k]??fallback}"><strong data-value="${i}">${num(saved?.scores?.[k]??fallback)}</strong><span>100</span></div></div>`).join('')}<p class="warning-note">Шедевр — 95–100; дуже сподобалося — близько 90; сподобалося — близько 80. Можна уточнити будь-яке значення.</p></form>`,footer('rubricForm','Зберегти /100'),true);updateRubric();

function updateRubric(){const f=$('#rubricForm');if(!f)return;const r=rec(f.dataset.id),scores={};f.querySelectorAll('[data-criterion]').forEach((x,i)=>{scores[x.dataset.criterion]=Number(x.value);f.querySelector(`[data-value="${i}"]`).textContent=x.value;});$('#rubricResult').textContent=num(calcRubric(r.category,scores));}

 case 'trackerdelete':{const t=db.trackers.find(x=>x.id===id);if(t&&confirm('Видалити лише трекер? Серіал у медіатеці залишиться.')){db.trackers=db.trackers.filter(x=>x.id!==id);ui.trackerId=null;noteManualEdit('Видалено трекер',rec(t.recordId));persist();render();}break;}
 case 'trackerepisode':{const t=db.trackers.find(x=>x.id===id),se=t?.seasons?.[Number(ix)],n=Number(el.dataset.num);if(!se||n<1||n>se.count)break;se.watched||=[];se.watched=se.watched.includes(n)?se.watched.filter(x=>x!==n):[...se.watched,n].sort((a,b)=>a-b);noteManualEdit('Змінено прогрес',rec(t.recordId));persist();render();break;}
 case 'trackernext':{const t=db.trackers.find(x=>x.id===id);if(!t)break;for(const se of t.seasons){const done=new Set(se.watched||[]),next=Array.from({length:se.count},(_,i)=>i+1).find(n=>!done.has(n));if(next){se.watched=[...(se.watched||[]),next].sort((a,b)=>a-b);noteManualEdit('Змінено прогрес',rec(t.recordId));persist();render();toast(`Відмічено: ${se.name} · серія ${next}`);break;}}break;}
 case 'tagtoggle':{const tag=el.dataset.tag,input=$('#f-tags');if(!input)return;const values=input.value.split(',').map(x=>x.trim()).filter(Boolean),found=values.findIndex(x=>x.toLowerCase()===tag.toLowerCase());if(found<0)values.push(tag);else values.splice(found,1);input.value=values.join(', ');el.classList.toggle('chosen',found<0);break;}
 case 'yeardrill':ui.page='movie';ui.yearBasis='record';ui.yearMode='single';ui.filterYear=el.dataset.year;ui.status='all';ui.more=0;render();window.scrollTo(0,0);break;
 }
}
document.addEventListener('click',e=>{const editorTab=e.target.closest('[data-editor-tab]');if(editorTab){const form=editorTab.closest('form');form?.querySelectorAll('[data-editor-tab]').forEach(b=>{const a=b===editorTab;b.classList.toggle('active',a);b.setAttribute('aria-pressed',String(a));});form?.querySelectorAll('[data-editor-pane]').forEach(p=>p.hidden=p.dataset.editorPane!==editorTab.dataset.editorTab);return;}const goEl=e.target.closest('[data-go]');if(goEl){go(goEl.dataset.go);return;}
 const a=e.target.closest('[data-action]');if(a)action(a.dataset.action,a);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.item-card,[data-action="detail"][tabindex]')){e.preventDefault();e.target.click();}
 if(e.key==='Escape'){closeModal();closeMenu();}
 if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus();$('#globalSearch').select();}
 if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();recordForm();}if(e.ctrlKey&&e.key==='Enter'){const f=document.querySelector('#modalRoot form');if(f){e.preventDefault();f.requestSubmit();}}
});
function syncTagGroupCheckboxes(){const f=document.querySelector('#tagEditor'),group=f?.querySelector('[name="tagGroup"]')?.value;if(!f)return;
 const allowed=tagGroupCategories(group);let any=false;
 f.querySelectorAll('[name="cat"]').forEach(el=>{if(!allowed.includes(el.value)){el.checked=false;el.disabled=true;}else{el.disabled=false;if(el.checked)any=true;}});
 if(!any){const first=f.querySelector(`[name="cat"][value="${allowed[0]}"]`);if(first)first.checked=true;}
}
document.addEventListener('pointerdown',e=>{const disc=e.target.closest('[data-color-disc]');if(!disc)return;const root=disc.closest('[data-color-picker]');activeWheelPointer={disc,root,id:e.pointerId};try{disc.setPointerCapture(e.pointerId);}catch(_){}wheelPointer(e,root);});
document.addEventListener('pointermove',e=>{if(activeWheelPointer?.id===e.pointerId)wheelPointer(e,activeWheelPointer.root);});
document.addEventListener('pointerup',e=>{if(activeWheelPointer?.id===e.pointerId){const {root,disc}=activeWheelPointer;wheelPointer(e,root);activeWheelPointer=null;try{disc.releasePointerCapture(e.pointerId);}catch(_){}if(root.dataset.colorPicker==='accent')persist();}});
document.addEventListener('pointercancel',e=>{if(activeWheelPointer?.id===e.pointerId){if(activeWheelPointer.root.dataset.colorPicker==='accent')persist();activeWheelPointer=null;}});
document.addEventListener('keydown',e=>{const disc=e.target.closest('[data-color-disc]');if(!disc||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const root=disc.closest('[data-color-picker]'),h=hexHsv(root.dataset.currentColor);if(e.key==='ArrowRight')h.h+=5;if(e.key==='ArrowLeft')h.h-=5;if(e.key==='ArrowUp')h.s=Math.min(1,h.s+.05);if(e.key==='ArrowDown')h.s=Math.max(0,h.s-.05);colorWheelSet(root,hsvHex(h.h,h.s,h.v),true);});
document.addEventListener('change',e=>{let t=e.target;if(t.matches('[data-color-hex]')){const root=t.closest('[data-color-picker]'),val=t.value.trim().startsWith('#')?t.value.trim():'#'+t.value.trim();if(!/^#[0-9a-f]{6}$/i.test(val)){toast('Введи HEX-код у форматі #AABBCC');t.value=root.dataset.currentColor.toUpperCase();}else colorWheelSet(root,val,true);return;}if(t.matches('[data-color-brightness]')){const root=t.closest('[data-color-picker]');if(root?.dataset.colorPicker==='accent')persist();return;}if(t.id==='f-tagGroup'&&t.closest('#tagEditor')){syncTagGroupCheckboxes();return;}if(t.id==='f-status'&&t.closest('#recordForm')&&t.closest('form').querySelector('[name="category"]')?.value==='game'){const live=GAME_LIVE_STATES.has(t.value),f=t.closest('form');f.querySelectorAll('[data-game-single-date]').forEach(el=>{el.hidden=!live;el.querySelectorAll('input').forEach(inp=>inp.disabled=!live);});f.querySelectorAll('[data-game-period]').forEach(el=>{el.hidden=live;el.querySelectorAll('input').forEach(inp=>inp.disabled=live);});return;}if(t.id==='f-seasonStatus'&&t.closest('#seasonForm')){const wrap=t.closest('form').querySelector('[data-season-drop-wrap]');if(wrap){wrap.hidden=t.value!=='dropped';const ep=wrap.querySelector('[name="droppedAtEpisode"]');if(ep){ep.disabled=t.value!=='dropped';if(t.value!=='dropped')ep.value='';}}return;}if(t.dataset.appearance){updateAppearanceField(t);return;}if(t.id==='importFile'){restore(t.files?.[0]);t.value='';return;}
 if(t.dataset.change==='status'){ui.status=t.value;ui.more=0;render();}
 if(t.dataset.change==='sort'){ui.sort=t.value;ui.more=0;render();}
 for(const [k,p] of [['tag','filterTag'],['genre','filterGenre'],['creator','filterCreator'],['releaseyear','filterReleaseYear']])if(t.dataset.change===k){ui[p]=t.value;ui.more=0;render();}
  if(t.dataset.change==='yearpick'){
   if(t.value==='__range'){ui.yearMode='range';ui.filterExpanded=true;ui.filterYear='all';ui.filterReleaseYear='all';}
   else{ui.yearMode='single';if(ui.yearBasis==='release'){ui.filterReleaseYear=t.value;ui.filterYear='all';}else{ui.filterYear=t.value;ui.filterReleaseYear='all';}}
   ui.more=0;render();return;
  }
  if(t.dataset.change==='yearmode'){ui.yearMode=t.checked?'range':'single';ui.more=0;render();return;}
  if(t.dataset.change==='yearbasis'){ui.yearBasis=t.value;ui.filterYear='all';ui.filterReleaseYear='all';ui.more=0;render();return;}
  if(t.dataset.change==='yearfrom'||t.dataset.change==='yearto'){ui[t.dataset.change==='yearfrom'?'yearFrom':'yearTo']=/^\d{4}$/.test(t.value)?t.value:'';ui.yearMode='range';ui.more=0;render();return;}
  if(t.dataset.change==='year'){ui.yearBasis='record';ui.yearMode='single';ui.filterYear=t.value;ui.filterReleaseYear='all';ui.more=0;render();}
 if(t.id==='f-category'&&t.closest('#recordForm')){const f=t.closest('form'),fd=new FormData(f),draft=Object.fromEntries(fd.entries());draft.wishlist=fd.has('wishlist');draft.favorite=fd.has('favorite');recordForm(f.dataset.id||null,t.value,draft);return;}
 if(t.dataset.moodFor){const f=t.closest('form'),input=f?.querySelector(`[name="${t.dataset.moodFor}"]`);if(input&&t.value!==''){input.value=t.value;input.dispatchEvent(new Event('input',{bubbles:true}));}return;}
});
document.addEventListener('input',e=>{if(e.target.matches('[data-color-brightness]')){const root=e.target.closest('[data-color-picker]'),h=hexHsv(root.dataset.currentColor);colorWheelSet(root,hsvHex(h.h,h.s,Number(e.target.value)/100));return;}if(e.target.id==='tagSettingsSearch'){ui.tagSearch=e.target.value;const start=e.target.selectionStart;render();const next=$('#tagSettingsSearch');if(next){next.focus({preventScroll:true});next.setSelectionRange(start,start);}return;}if(e.target.dataset.appearance==='roundness'){updateAppearanceField(e.target);return;}if(e.target.matches('#rubricForm [data-criterion]'))updateRubric();
 const t=e.target;if(t.dataset.freetext){const name=t.dataset.freetext,pos=t.selectionStart;ui.filterText[name]=t.value;ui.more=0;render();const restored=document.querySelector(`[data-freetext="${name}"]`);if(restored){restored.focus({preventScroll:true});try{restored.setSelectionRange(pos,pos);}catch(e){}}}
});
document.addEventListener('submit',e=>{const f=e.target;if(!['recordForm','viewingForm','seasonForm','seasonViewingForm','gameSessionForm','bookSessionForm','rubricForm','trackerForm','trackerSeasonForm','tagEditor','moodEditor'].includes(f.id))return;e.preventDefault();if(f.id==='moodEditor')saveMood(f);if(f.id==='tagEditor')saveTag(f);if(f.id==='recordForm')saveRecord(f);if(f.id==='viewingForm')saveViewing(f);if(f.id==='seasonForm')saveSeason(f);if(f.id==='seasonViewingForm')saveSeasonViewing(f);if(f.id==='gameSessionForm')saveGameSession(f);if(f.id==='bookSessionForm')saveBookSession(f);if(f.id==='rubricForm')saveRubric(f);if(f.id==='trackerForm')saveTracker(f);if(f.id==='trackerSeasonForm')saveTrackerSeason(f);});
$('#globalSearch').addEventListener('input',e=>{ui.query=e.target.value;if(ui.page==='home'||!['movie','tv','game','book','queue','library','search'].includes(ui.page))ui.page='library';ui.more=0;render();});
$('#randomBtn').innerHTML=icon('shuffle');$('#randomBtn').onclick=()=>{ui.randomId=null;go('random');};
$('#searchIcon').innerHTML=icon('search',16);$('#plusIcon').innerHTML=icon('plus',17);$('#topAdd').onclick=()=>recordForm();
$('#themeToggle').onclick=()=>{const p=db.settings.appearance;p.mode=p.mode==='light'?'dark':'light';localStorage.setItem(THEME,p.mode);savePrefs();};
applyAppearance();
$('#sidebarBackup').innerHTML=icon('download');$('#sidebarBackup').onclick=backup;
$('#helpButton').innerHTML=icon('help-circle');$('#helpButton').onclick=help;
$('#menuToggle').innerHTML=icon('menu');$('#menuToggle').onclick=()=>{$('#sidebar').classList.toggle('open');$('#mobileShade').classList.toggle('show');};
$('#mobileShade').onclick=closeMenu;
render();
 if(location.protocol==='https:'||location.protocol==='http:')cloudRefresh({startup:true});
})();
  </script>
